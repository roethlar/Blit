[package]
name = "blit-gui"
version.workspace = true
edition = "2021"
license.workspace = true

# Thin egui face of the Blit Console (docs/plan/BLIT_CONSOLE.md §2, C1).
# Product logic lives in blit-console-core; this crate renders the model
# and dispatches messages. Not a release-archive binary.

[[bin]]
name = "blit-gui"
path = "src/main.rs"

[dependencies]
blit-console-core = { path = "../blit-console-core" }
eframe = "0.36.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
