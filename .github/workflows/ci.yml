name: CI

on:
  push:
    branches: [master]
    # A v* tag runs the same gate as a master push and then publishes the
    # packaged archives to that tag's GitHub release (see build-release).
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: release smoke guards
        run: python3 scripts/release_smoke_test.py
      - name: package-manager stub guards
        run: python3 scripts/package_managers/test_generate.py
      - name: package-manager publish guards
        run: python3 scripts/package_managers/test_publish.py

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: native GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev
      - name: cargo test
        run: cargo test --workspace

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: temporary firewall helper
        run: scripts/macos/test-with-temporary-firewall-rule.sh
      - name: cargo test
        run: cargo test --workspace

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace

  build-release:
    name: Build Release (${{ matrix.target }})
    needs: [check, test-linux, test-macos, test-windows]
    # A master push proves the packaging lane; a v* tag does the same work and
    # additionally attaches the archives to the release for that tag.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      # Creating the release and uploading its assets is the only write this
      # job needs; everything else here reads.
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            python: python3
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            python: python3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            python: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: native GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev
      - name: Resolve workspace release version
        id: release-version
        shell: bash
        run: |
          version="$(cargo metadata --format-version 1 --no-deps | \
            ${{ matrix.python }} -c 'import json, sys; data = json.load(sys.stdin); versions = {package["version"] for package in data["packages"]}; assert len(versions) == 1, f"workspace package versions differ: {sorted(versions)}"; print(versions.pop())')"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Sign and notarize macOS binaries
        # Signing activates only when the repo carries the whole Apple secret
        # set; a contributor or fork build packages UNSIGNED binaries and stays
        # green. A missing GitHub secret renders as an EMPTY-BUT-DEFINED env
        # var, so every gate here tests non-empty, never merely defined.
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 KEYCHAIN_PASSWORD; do
            if [ -z "$(printenv "${name}" || true)" ]; then
              echo "::notice title=Unsigned macOS release::${name} is empty; packaging unsigned binaries"
              exit 0
            fi
          done

          bin_dir="target/${TARGET}/release"
          certificate="${RUNNER_TEMP}/developer-id.p12"
          keychain="${RUNNER_TEMP}/blit-signing.keychain-db"

          test -x "${bin_dir}/blit"
          test -x "${bin_dir}/blit-daemon"

          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${certificate}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "${keychain}"
          security default-keychain -s "${keychain}"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain}"
          security find-identity -v -p codesigning "${keychain}"

          # Hardened runtime and a secure timestamp are both prerequisites for
          # notarizing a Developer ID signature.
          for binary in blit blit-daemon; do
            codesign --force --sign "${APPLE_SIGNING_IDENTITY}" --options runtime --timestamp \
              "${bin_dir}/${binary}"
          done

          # A signing step can silently no-op and still exit 0, so the
          # signature is asserted rather than assumed.
          for binary in blit blit-daemon; do
            codesign --verify --deep --strict --verbose=2 "${bin_dir}/${binary}"
            codesign -dv --verbose=4 "${bin_dir}/${binary}" 2>&1 | tee "${RUNNER_TEMP}/codesign-${binary}.txt"
            grep -q 'Authority=Developer ID Application' "${RUNNER_TEMP}/codesign-${binary}.txt"
          done

          key_dir="${RUNNER_TEMP}/private_keys"
          key_path="${key_dir}/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -p "${key_dir}"
          printf '%s' "${APPLE_API_KEY_P8}" > "${key_path}"
          chmod 600 "${key_path}"

          # notarytool needs a container, so the signed binaries ride a
          # throwaway zip. Flat executables CANNOT be stapled — there is no
          # bundle to hold the ticket — so nothing is stapled and Gatekeeper
          # resolves the notarization ticket online instead. The zip is
          # submission-only; the release tarball still carries the binaries.
          notarize_stage="${RUNNER_TEMP}/notarize"
          notarize_zip="${RUNNER_TEMP}/blit-${TARGET}-notarize.zip"
          notarize_log="${RUNNER_TEMP}/notarytool-submit.txt"

          test ! -e "${notarize_stage}"
          mkdir -p "${notarize_stage}"
          cp "${bin_dir}/blit" "${bin_dir}/blit-daemon" "${notarize_stage}/"
          ditto -c -k --keepParent "${notarize_stage}" "${notarize_zip}"

          xcrun notarytool submit "${notarize_zip}" \
            --key "${key_path}" \
            --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait 2>&1 | tee "${notarize_log}"
          # Some notarytool versions exit 0 on a rejected submission, so the
          # accepted status is read back out of its own output.
          grep -qE '^[[:space:]]*status: Accepted$' "${notarize_log}"

          rm -rf "${notarize_stage}" "${notarize_zip}" "${certificate}" "${key_path}"
      - name: Package Unix release
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="blit-${TARGET}"
          bin_dir="target/${TARGET}/release"
          stage="${RUNNER_TEMP}/${package}"
          archive="dist/${package}.tar.gz"
          checksum="${archive}.sha256"

          test -x "${bin_dir}/blit"
          test -x "${bin_dir}/blit-daemon"
          test ! -e "${stage}"
          mkdir -p "${stage}" dist
          cp "${bin_dir}/blit" "${stage}/"
          cp "${bin_dir}/blit-daemon" "${stage}/"
          cp README.md LICENSE CHANGELOG.md "${stage}/"
          printf '%s\n' "${GITHUB_SHA}" > "${stage}/BUILD.txt"
          tar -C "${RUNNER_TEMP}" -czf "${archive}" "${package}"
          python3 -c 'import hashlib, pathlib, sys; p = pathlib.Path(sys.argv[1]); print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")' "${archive}" > "${checksum}"
          test -s "${archive}"
          test -s "${checksum}"
      - name: Sign Windows binaries
        # Azure Trusted Signing; the three AZURE_* credentials are read
        # automatically by the TrustedSigning module's EnvironmentCredential.
        # Same gating rule as the macOS leg: a missing GitHub secret renders as
        # an EMPTY-BUT-DEFINED env var, so an incomplete set means an unsigned
        # (still green) package rather than a failed job.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @(
            "AZURE_TENANT_ID", "AZURE_CLIENT_ID", "AZURE_CLIENT_SECRET",
            "AZURE_SIGNING_ENDPOINT", "AZURE_SIGNING_ACCOUNT", "AZURE_CERT_PROFILE")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Host "::notice title=Unsigned Windows release::$name is empty; packaging unsigned binaries"
              exit 0
            }
          }

          # Invoke-TrustedSigning refuses relative paths ("file path ... is
          # not rooted" — the first signed run failed exactly there), so the
          # binary paths are rooted at the workspace.
          $binDir = Join-Path $env:GITHUB_WORKSPACE "target" "$env:TARGET/release"
          $binaries = @("blit.exe", "blit-daemon.exe") | ForEach-Object { Join-Path $binDir $_ }
          foreach ($path in $binaries) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "required release binary is missing: $path"
            }
          }

          # NuGet is usually already present on the hosted image; Install-Module
          # is what actually needs it, and reports clearly if it is absent.
          try {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          } catch {
            Write-Host "NuGet provider not installed here: $($_.Exception.Message)"
          }
          Install-Module -Name TrustedSigning -MinimumVersion 0.5.0 -Force -Repository PSGallery -Scope CurrentUser

          foreach ($path in $binaries) {
            Invoke-TrustedSigning `
              -Endpoint $env:AZURE_SIGNING_ENDPOINT `
              -CodeSigningAccountName $env:AZURE_SIGNING_ACCOUNT `
              -CertificateProfileName $env:AZURE_CERT_PROFILE `
              -TimestampRfc3161 "http://timestamp.acs.microsoft.com" `
              -TimestampDigest "SHA256" `
              -FileDigest "SHA256" `
              -Files $path
          }

          # A signing step can silently no-op and still exit 0, so the
          # signature is asserted rather than assumed.
          foreach ($path in $binaries) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne "Valid") {
              throw "authenticode signature is not valid for ${path}: $($signature.Status) — $($signature.StatusMessage)"
            }
            Write-Host "signed $path <- $($signature.SignerCertificate.Subject)"
          }
      - name: Package Windows release
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $package = "blit-$env:TARGET"
          $binDir = Join-Path "target" "$env:TARGET/release"
          $stage = Join-Path $env:RUNNER_TEMP $package
          $archive = Join-Path "dist" "$package.zip"
          $checksum = "$archive.sha256"

          foreach ($binary in @("blit.exe", "blit-daemon.exe")) {
            $path = Join-Path $binDir $binary
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "required release binary is missing: $path"
            }
          }
          if (Test-Path -LiteralPath $stage) {
            throw "release staging path already exists: $stage"
          }
          New-Item -ItemType Directory -Path $stage | Out-Null
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $binDir "blit.exe") -Destination $stage
          Copy-Item -LiteralPath (Join-Path $binDir "blit-daemon.exe") -Destination $stage
          Copy-Item -LiteralPath "README.md", "LICENSE", "CHANGELOG.md" -Destination $stage
          Set-Content -LiteralPath (Join-Path $stage "BUILD.txt") -Value $env:GITHUB_SHA
          Compress-Archive -Path $stage -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksum -Value "$hash  $package.zip"
          foreach ($path in @($archive, $checksum)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf) -or
                (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "required release artifact is missing or empty: $path"
            }
          }
      - name: Smoke packaged release
        run: >-
          ${{ matrix.python }} scripts/release_smoke.py
          --archive dist/blit-${{ matrix.target }}.${{ matrix.archive }}
          --checksum dist/blit-${{ matrix.target }}.${{ matrix.archive }}.sha256
          --expected-version ${{ steps.release-version.outputs.version }}
          --expected-commit ${{ github.sha }}
      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: blit-${{ matrix.target }}
          path: |
            dist/blit-${{ matrix.target }}.${{ matrix.archive }}
            dist/blit-${{ matrix.target }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
  publish-release:
    name: Publish release
    # A job that `needs` a matrix job only runs if EVERY leg of that matrix
    # succeeded — this is the fix for a real high-severity defect the
    # adversarial review round caught: three legs attaching independently
    # meant one leg's failure (a live risk; signing calls out to Apple
    # notarization and Azure Trusted Signing, and Azure 403'd on the first
    # signed run today) left the other, already-finished legs' assets
    # published on a public, non-draft release with no rollback and no
    # completeness check. Gating the single attach step behind `needs` on
    # the whole matrix makes the release atomic: all three platforms
    # succeed and it publishes with all six files, or any one fails and no
    # release is created or modified at all.
    needs: [build-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v6
        with:
          pattern: blit-*
          path: dist
          merge-multiple: true
      - name: Publish the tag's release
        # Title and draft state are both stated EXPLICITLY so neither drifts
        # with an action default. Verified against the GitHub API on 2026-08-08:
        # the only release this repo has ever published is `v0.1.1`, titled
        # `Blit v0.1.1`, non-draft and non-prerelease (`v0.1.0` is a bare tag
        # with no release object, so it is not evidence either way). Left
        # unset, the action titles a release it creates with the bare tag
        # ("v0.1.2"), which is NOT this repo's convention — hence `name`.
        #
        # Notes are left alone; the action only writes a body when one is
        # given, so hand-written notes (docs/RELEASE_NOTES_1_0.md) added to the
        # release survive a later re-run of this job.
        #
        # fail_on_unmatched_files is what stops a missing archive from
        # publishing a silently incomplete release: without it the action
        # reports the miss and still exits 0. With the atomic gate above this
        # is now belt-and-braces rather than the only safety net.
        uses: softprops/action-gh-release@v2
        with:
          name: Blit ${{ github.ref_name }}
          draft: false
          fail_on_unmatched_files: true
          files: dist/*

  package-managers:
    name: Update package managers
    # Downstream of the atomic attach. Failure here must not draft, delete,
    # or rewrite the GitHub Release — this job never calls the release API.
    needs: [publish-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Download release sidecars
        uses: actions/download-artifact@v6
        with:
          pattern: blit-*
          path: dist
          merge-multiple: true
      - name: Fetch the GitHub tag source tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          curl -fsSL "https://github.com/roethlar/Blit/archive/refs/tags/${TAG}.tar.gz" \
            -o "dist/Blit-${version}.tar.gz"
          test -s "dist/Blit-${version}.tar.gz"
      - name: Update configured channels
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          SCOOP_BUCKET_REPO: ${{ secrets.SCOOP_BUCKET_REPO }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          WINGET_PKGS_FORK: ${{ secrets.WINGET_PKGS_FORK }}
          HOMEBREW_CORE_TOKEN: ${{ secrets.HOMEBREW_CORE_TOKEN }}
          HOMEBREW_CORE_FORK: ${{ secrets.HOMEBREW_CORE_FORK }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse --short=12 "${GITHUB_SHA}")"
          python3 scripts/package_managers/publish.py \
            --tag "${GITHUB_REF_NAME}" \
            --tag-sha "${tag_sha}" \
            --sidecars dist \
            --source-tarball "dist/Blit-${GITHUB_REF_NAME#v}.tar.gz" \
            --repo-root .
