# Updates Homebrew / AUR / Scoop / winget after a GitHub Release.
# Never receives signing secrets. A failure here does not mutate the release.
name: Package managers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package (for example v0.1.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  update:
    name: Update package managers
    runs-on: ubuntu-latest
    steps:
      # Check out the dispatching branch, not the tag: the packaging
      # scripts must come from the current tree (a bootstrap tag like
      # v0.1.2 predates them). The tag is only resolved to its SHA below.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update configured channels
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          SCOOP_BUCKET_REPO: ${{ secrets.SCOOP_BUCKET_REPO }}
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
          WINGET_PKGS_FORK: ${{ secrets.WINGET_PKGS_FORK }}
          HOMEBREW_CORE_TOKEN: ${{ secrets.HOMEBREW_CORE_TOKEN }}
          HOMEBREW_CORE_FORK: ${{ secrets.HOMEBREW_CORE_FORK }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_sha="$(git rev-parse --short=12 "$TAG")"
          python3 scripts/package_managers/publish.py \
            --tag "$TAG" \
            --tag-sha "${tag_sha}" \
            --repo-root .
